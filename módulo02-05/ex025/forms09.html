<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="#" method="post">

        <p><label for="inumber">Contador:</label><input type="range" name="number" id="inumber" min="0" max="10" oninput="icont.innerHTML=Number(inumber.value)"> <output id="icont">5</output></p>
      





        <p><input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
