<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imasc">Masculino <br>
            <input type="radio" name="sexo" id="ifemi" checked>Feminino
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="ifut"><input type="checkbox" name="fut" id="ifut" checked>Futebol <br></label>
            <label for="ibasq"><input type="checkbox" name="basq" id="ibasq">Basquete <br></label>
            <label for="itenis"><input type="checkbox" name="tenis" id="itenis">Tenis <br></label>
            <label for="if1"><input type="checkbox" name="f1" id="if1">F1</label>
        </fieldset>

        <p><input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
