<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="#" method="post">
        <p><label for="iestado">Estado</label>
        <select name="estado" id="iestado">
            <optgroup label="centro-oeste">
                <option value="GO" selected>Goiás</option>
                <option value="MT">Mato Grosso</option>
            </optgroup>
            <optgroup label="Sudeste">
                <option value="SP">São Paulo</option>
                <option value="MG">Minas Gerais</option>
            </optgroup>
        </select>  
        </p>
        <p><label for="iprof">Profissao:</label><input type="text" name="prof" id="iprof" list="isprof">
        <datalist id="isprof">
            <option value="ENG">engenharia</option>
            <option value="ADM">Administardor</option>
            <option value="PRO">Professor</option>
        </datalist></p>
        <p><label for="imsg"></label>Comentario: <textarea name="msg" id="imsg" cols="10" rows="5"></textarea></p>


        <p><input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
