<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h2>Teste Formulário</h2>
    <form action="#" method="post" autocomplete="on">

        <p><label for="Iusuario">Usuário:</label><input type="text" name="usuurio" id="Iusuario" required placeholder="nome do usuario" autocomplete="username"></p>

        <p><label for="isenha">Senha:</label><input type="password" name="senha" id="isenha" required placeholder="digite a senha" autocomplete="current-password"></p>

        <p><input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>

</html>
