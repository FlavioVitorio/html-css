<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h2>Formulário Aluno</h2>
    <form action="#" method="get">
        <p><label for="inome">Nome:</label><input type="text" name="nome" id="inome" required maxlength="25" placeholder="Nome Completo"></p>
        <p><label for="imedia">Media:</label><input type="number" name="media" id="imedia" min="0" max="10" step="0.1"></p>
        <p><label for="imes">Período letivo:</label><input type="month" name="mes" id="imes" value="2026-08"></p>
        <p><label for="iprova">Dia da prova:</label><input type="date" name="dia" id="idia" required value="2026-08-27"></p>
        <p><label for="ihora">Hora da Prava:</label><input type="time" name="hora" id="ihora" required value="11:34"></p>
        <p><input type="submit" value="Enviar">
        <input type="reset" value="Limpar"></p>
    </form>
</body>
</html>
