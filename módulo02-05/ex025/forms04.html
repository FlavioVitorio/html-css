<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Formulário de Cadrastro</h1>
    <form action="#" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados</legend>
            <p><label for="inome">Nome:</label><input type="text" name="nome" id="inome" required></p>
            <div><label for="iemail">Email:</label><input type="email" name="email" id="iemail" required autocomplete="email"></div>
            <p><label for="itel">Telefone:</label> <input type="tel" name="tel" id="itel" autocomplete="tel-national" required pattern="^[0-9]{4,5}-[0-9]{4}$"></p>
        </fieldset>

        <p><input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
        </p>

    </form>
</body>

</html>
